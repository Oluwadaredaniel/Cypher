name: cypher
description: CYPHER - Android PC Remote Control
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # CORE
  http: ^1.2.0
  provider: ^6.1.5
  shared_preferences: ^2.5.5

  # UI
  google_fonts: ^8.1.0
  shimmer: ^3.0.0
  animate_do: ^4.1.1
  flutter_svg: ^2.3.0
  percent_indicator: ^4.2.5
  fluttertoast: ^9.0.0

  # FILE SYSTEM (stable compatible cluster)
  file_picker: ^8.1.2
  path_provider: ^2.1.5
  path: ^1.9.1
  open_filex: ^4.7.0

  # DEVICE INFO (must stay aligned with older ecosystem)
  device_info_plus: ^12.1.0

  # UTILITIES
  uuid: ^4.5.3
  intl: ^0.20.0

  # NETWORK DISCOVERY
  nsd: ^5.0.0

  # BACKGROUND TASKS
  workmanager: ^0.9.0+3

  # SCANNING
  mobile_scanner: ^7.2.0
  qr_flutter: ^4.1.0

  # FIREBASE (stable compatible baseline)
  firebase_core: ^4.8.0
  firebase_analytics: ^12.4.0

  # PERMISSIONS
  permission_handler: ^11.3.1
  url_launcher: ^6.3.2
  media_scanner: ^2.2.1

  # MEDIA
  video_player: ^2.11.1
  chewie: ^1.13.1
  just_audio: ^0.10.5

  # SHARING
  share_plus: ^12.0.2

  # DOCUMENTS
  syncfusion_flutter_pdfviewer: ^33.2.5
  flutter_markdown_plus: ^1.0.7
  flutter_highlight: ^0.7.0
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true