# Project-wide Gradle settings
# [SAFE FIX] Set limit to 4GB to keep your PC fast
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -Dfile.encoding=UTF-8

# AndroidX support
android.useAndroidX=true
android.enableJetifier=true

# Performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# [STABILITY FIX] Stop AAPT2 from hanging on Windows
android.aapt2.no_resource_verification=true
android.aapt2.delay_full_verification=true

# [PRO FIX] Skip the AAR metadata check entirely
android.experimental.skip.check.aar.metadata=true
