# Project-wide Gradle settings (LOW RAM SAFE MODE)

# Keep memory low so build doesn't crash
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
kotlin.daemon.jvm.options=-Xmx512m

# AndroidX support
android.useAndroidX=true
android.enableJetifier=true

# Reduce heavy parallel work (IMPORTANT for low RAM PCs)
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

# Stability fixes (keep these light)
android.aapt2.no_resource_verification=true
android.aapt2.delay_full_verification=true

# Disable experimental heavy checks
android.experimental.skip.check.aar.metadata=true

# Prevent background Gradle memory drain
org.gradle.daemon=false